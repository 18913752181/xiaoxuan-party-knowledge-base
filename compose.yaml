services:
  web:
    image: xiaoxuan-site:latest
    build:
      context: .
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://xiaoxuanvip.com}
    restart: unless-stopped
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    env_file:
      - ${APP_ENV_FILE:-/srv/xiaoxuan/shared/app.env}
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ${CONTENT_DIR:-/srv/xiaoxuan/shared/content}:/app/content
      - ${DATA_DIR:-/srv/xiaoxuan/shared/data}:/app/data
      - ${WECHAT_PAY_CERT_DIR:-/srv/xiaoxuan/shared/wechat-pay}:/srv/xiaoxuan/shared/wechat-pay:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # 每分钟扫描到期提醒、每小时补齐年度会员每日积分；接口只在容器网络内调用。
  reminder-dispatcher:
    image: xiaoxuan-site:latest
    restart: unless-stopped
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    env_file:
      - ${APP_ENV_FILE:-/srv/xiaoxuan/shared/app.env}
    environment:
      NODE_ENV: production
    depends_on:
      web:
        condition: service_healthy
    entrypoint: ["node", "-e"]
    command:
      - >-
        const reminderSecret=process.env.REMINDER_CRON_SECRET||'';
        const pointsSecret=process.env.MEMBERSHIP_POINTS_CRON_SECRET||reminderSecret;
        async function call(url,secret,label){if(!secret){console.warn('['+label+'] cron secret is not configured');return;}try{const r=await fetch(url,{headers:{authorization:'Bearer '+secret}});if(!r.ok)console.warn('['+label+'] dispatch failed',r.status);}catch(e){console.warn('['+label+'] dispatch unavailable',e instanceof Error?e.message:String(e));}}
        const reminders=()=>call('http://web:3000/api/internal/reminders/dispatch',reminderSecret,'member-reminders');
        const points=()=>call('http://web:3000/api/internal/membership-points/grant-daily',pointsSecret,'membership-points');
        reminders();points();setInterval(reminders,60000);setInterval(points,3600000);

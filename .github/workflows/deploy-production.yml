name: Deploy production

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: xiaoxuan-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check out release
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Package release
        run: tar --exclude=.git -czf /tmp/xiaoxuan-release.tar.gz .

      - name: Upload, build and restart
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          archive="/tmp/xiaoxuan-${GITHUB_SHA}.tar.gz"
          scp -i ~/.ssh/deploy_key -P "${DEPLOY_PORT:-22}" \
            -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o ServerAliveInterval=15 -o ServerAliveCountMax=40 \
            /tmp/xiaoxuan-release.tar.gz \
            "$DEPLOY_USER@$DEPLOY_HOST:$archive"
          ssh -i ~/.ssh/deploy_key -p "${DEPLOY_PORT:-22}" \
            -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o ServerAliveInterval=15 -o ServerAliveCountMax=40 \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "set -Eeuo pipefail; release='/srv/xiaoxuan/releases/${GITHUB_SHA}'; mkdir -p \"\$release\"; tar -xzf '$archive' -C \"\$release\"; rm -f '$archive'; COMPOSE_PROJECT_NAME=app APP_DIR=\"\$release\" bash \"\$release/deploy/deploy.sh\""
